<!-- Keep title and favicon in one line, so the github actions remove them correctly -->
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <base href="/" />
  <title><%= apTitle %></title>

  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#050D1A" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Plugr" />

  <meta name="description" content="Plugr is a fully managed automation platform with an AI builder that discovers live integration actions and builds a flow you can inspect, validate, and test." />
  <meta property="og:site_name" content="Plugr" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Plugr — Visual Workflow Automation with an AI Builder" />
  <meta property="og:description" content="Describe the work. Inspect the workflow. Plugr's AI builder discovers live integration actions and fields, then creates a flow you can inspect, validate, and test." />
  <meta property="og:url" content="https://plugr.cloud/" />
  <meta property="og:image" content="https://plugr.cloud/plugr-logo-v2.png" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Plugr — Visual Workflow Automation with an AI Builder" />
  <meta name="twitter:description" content="Describe the work. Inspect the workflow. Plugr's AI builder discovers live integration actions and fields, then creates a flow you can inspect, validate, and test." />
  <meta name="twitter:image" content="https://plugr.cloud/plugr-logo-v2.png" />
  <link rel="alternate" type="application/rss+xml" title="Plugr Blog" href="/feed.xml" />

  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/logo-192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/logo-180.png">
  <link rel="stylesheet" href="/src/styles.css" />

  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Plugr",
      "url": "https://plugr.cloud",
      "logo": "https://plugr.cloud/logo-192.png"
    }
  </script>
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "Plugr",
      "applicationCategory": "BusinessApplication",
      "operatingSystem": "Web",
      "url": "https://plugr.cloud",
      "description": "Visual workflow automation with an AI builder that discovers live integration actions and fields, then creates a flow you can inspect, validate, and test."
    }
  </script>
</head>

<body>
  <div id="root"></div>
  <script>
    // index.html is shared by the marketing homepage ("/") and every other
    // app route (SPA fallback). A prerendered copy of the homepage is
    // injected into #root above at build time so non-JS crawlers see real
    // content at "/" — but every other route must not show that flash before
    // the app hydrates. This runs synchronously before paint.
    if (window.location.pathname !== '/') {
      var rootEl = document.getElementById('root');
      if (rootEl) rootEl.textContent = '';
    }
  </script>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
